# ==============================================================================
# Configuração Nginx para Flow PRO no Hostinger VPS (Ubuntu 24.04)
# Local de instalação recomendado no VPS: /etc/nginx/sites-available/flow.klynner.com.br
# ==============================================================================

server {
    listen 80;
    server_name flow.klynner.com.br; # Substitua pelo seu subdomínio ou domínio se necessário

    # Limite de tamanho de upload para requisições de dados
    client_max_body_size 20M;

    # Encaminha o tráfego de forma transparente para o container Docker (porta 3001 interna)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts seguros
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
